<head>
<meta charset="UTF-8">

<title>高中数学新教材 · 知识点目录导航（五版本 24 册）</title>

<style>
:root{
  --bg:#f3f7fc; --panel:#fff; --ink:#1d2b3b; --muted:#6b7d91;
  --line:#e3ebf5; --blue:#2563eb; --blue-soft:#eaf2ff; --teal:#0e9384;
  --teal-soft:#e2f6f1; --amber:#b45309; --amber-soft:#fff2d5;
  --shadow:0 2px 10px rgba(31,64,110,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Segoe UI",sans-serif;
  font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
::selection{background:#cfe3ff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbdcee;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#a9c5e6}

/* ---------- 顶栏：站名 + 搜索框 + 视图切换，同一行 ---------- */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.tb-inner{max-width:1320px;margin:0 auto;padding:9px 24px;display:flex;
  align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.logo{width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,#2563eb,#0e9384);color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:16px;box-shadow:0 4px 12px rgba(37,99,235,.22)}
.brand-t{font-size:16px;font-weight:800;color:#12325b;letter-spacing:.3px;line-height:1.35}
.brand-s{font-size:11.5px;color:var(--muted);line-height:1.3}
.tb-right{display:flex;align-items:center;gap:12px;margin-left:auto;flex:none}
.tb-hint{font-size:12px;color:#93a6b9}
.seg{display:flex;background:#eef4fb;border:1px solid var(--line);padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 17px;font-size:13px;
  color:#5b7189;cursor:pointer;transition:.18s;white-space:nowrap}
.seg button.on{background:#fff;color:var(--blue);font-weight:800;box-shadow:0 1px 5px rgba(31,64,110,.12)}
/* 顶栏内紧凑搜索框 */
.searchwrap{flex:1 1 360px;max-width:620px;min-width:210px;display:flex;align-items:center;gap:8px;
  background:#f8fbff;border:1px solid var(--line);border-radius:10px;padding:0 11px;height:38px;
  transition:.2s}
.searchwrap:focus-within{background:#fff;border-color:#8fb8f5;
  box-shadow:0 0 0 3px rgba(37,99,235,.10)}
.searchwrap svg{flex:none;color:#7e95ad}
.searchwrap input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13.5px;color:var(--ink)}
.searchwrap input::placeholder{color:#a2b3c5}
.kbd{font-size:10.5px;color:#93a6b9;border:1px solid var(--line);border-radius:5px;
  padding:0 5px;background:#fff;flex:none}
.clearq{border:0;background:#eef4fb;color:#7b90a6;width:20px;height:20px;border-radius:5px;
  cursor:pointer;line-height:1;font-size:14px;display:none;flex:none}
.clearq.show{display:block}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid #dfeaf7;
  background:linear-gradient(118deg,#e9f2ff 0%,#f7fbff 48%,#e7f7f3 100%)}
.hero::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(#a9c9f2 1px,transparent 1px);background-size:23px 23px;
  opacity:.33;-webkit-mask-image:linear-gradient(90deg,#000,transparent 78%);
  mask-image:linear-gradient(90deg,#000,transparent 78%)}
.hero-inner{max-width:1320px;margin:0 auto;padding:22px 24px 20px;position:relative}
.hero h1{margin:0 0 6px;font-size:31px;line-height:1.3;letter-spacing:.5px;color:#102f57;font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(180deg,transparent 68%,#ffe6a8 68%)}
.lead{margin:0;font-size:14px;color:#55708c;max-width:900px}

/* ---------- 工具条 ---------- */
.filterbar{position:sticky;top:56px;z-index:40;background:rgba(255,255,255,.95);
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.fb-inner{max-width:1320px;margin:0 auto;padding:9px 24px;display:flex;gap:7px;
  align-items:center;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:#fff;color:#5b7189;border-radius:8px;
  padding:5px 12px;font-size:12.5px;cursor:pointer;transition:.18s;white-space:nowrap}
.fchip:hover{border-color:#9fc0f5;color:var(--blue)}
.fchip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;
  box-shadow:0 2px 8px rgba(37,99,235,.22)}
.fb-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.fb-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.count{font-size:12.5px;color:var(--muted)}
.count b{color:var(--blue)}
.toggle{border:1px solid var(--line);background:#f8fbff;color:#52708e;border-radius:8px;
  padding:5px 11px;font-size:12.5px;cursor:pointer}
.toggle:hover{border-color:#9fc0f5;color:var(--blue)}

/* ---------- 主体 ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:24px 24px 56px}
.topic-intro{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 18px;
  margin-bottom:18px;font-size:13px;color:#55708c;box-shadow:var(--shadow)}
.topic-intro b{color:#173b68}
.ver-block{margin-bottom:34px;scroll-margin-top:118px}
.ver-block.flash .ver-head{animation:flash 1.1s ease}
@keyframes flash{0%,100%{box-shadow:var(--shadow)}30%{box-shadow:0 0 0 4px #cfe3ff}}
.ver-head{display:flex;align-items:center;gap:13px;padding:13px 17px;background:#fff;
  border:1px solid var(--line);border-left:5px solid var(--vc);border-radius:14px;box-shadow:var(--shadow)}
.ver-badge{width:48px;height:48px;border-radius:12px;flex:none;background:var(--vcs);color:var(--vc);
  display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.3px}
.ver-txt{min-width:0}
.ver-name{font-size:18px;font-weight:800;color:#153a66;line-height:1.35}
.ver-desc{font-size:12px;color:var(--muted)}
.ver-meta{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.vm{background:#f5f9fe;border:1px solid var(--line);border-radius:8px;padding:3px 9px;
  font-size:11.5px;color:#6b7d91;white-space:nowrap}
.vm b{color:var(--vc);font-size:13px}
.group-title{display:flex;align-items:center;gap:9px;margin:20px 2px 11px;font-size:14px;
  font-weight:800;color:#2c4a69}
.group-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.gtag{font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 9px}
.gtag.b{background:var(--amber-soft);color:var(--amber)}
.gtag.xb{background:var(--teal-soft);color:var(--teal)}
.gcount{font-size:12px;font-weight:400;color:#9aabbb}
.book-grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:16px;align-items:stretch}
.book-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 15px 14px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s,border-color .2s;animation:fadeUp .38s backwards;
  animation-delay:var(--d,0s)}
body.filtering .book-card,body.filtering .topic-card{animation:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.book-card::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--vc)}
.book-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(31,64,110,.13);border-color:#c8dcf5}
.bc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.b{background:var(--amber-soft);color:var(--amber)}
.pill.xb{background:var(--teal-soft);color:var(--teal)}
.code{font-size:11px;color:#a4b4c4;font-family:Consolas,"Courier New",monospace;letter-spacing:.4px}
.bc-name{margin:11px 0 1px;font-size:16px;font-weight:800;color:#173b68;line-height:1.4}
.bc-sub{font-size:11.5px;color:#9aabbb;line-height:1.5;min-height:17px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.metrics{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0 10px}
.metric{font-size:11.5px;color:#5b7189;background:#f5f9fe;border:1px solid #ecf2fa;
  border-radius:6px;padding:2px 8px}
.metric b{color:var(--vc)}
.chapters{border-top:1px dashed var(--line);padding-top:7px;flex:1}
.chapter{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;font-size:13px;
  color:#415a74;transition:.15s}
.chapter:hover{background:var(--vcs);color:var(--vc)}
.ch-no{flex:none;min-width:23px;height:21px;padding:0 4px;border-radius:6px;background:#f0f5fc;
  color:#7d93aa;font-size:10.5px;display:grid;place-items:center;font-weight:700}
.chapter:hover .ch-no{background:#fff;color:var(--vc)}
.ch-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-kp{flex:none;font-size:10.5px;color:#a4b4c4}
.ch-arrow{flex:none;color:#bccddd;font-size:16px;line-height:1}
.chapter.hit{background:#fff5e0;color:#92400e;box-shadow:inset 0 0 0 1px #f6d79c}
.chapter.hit .ch-no{background:#fff;color:#b45309}
.more{display:block;width:100%;margin-top:4px;border:0;background:#f7faff;color:#5b7fa9;
  border-radius:7px;padding:5px;font-size:12px;cursor:pointer}
.more:hover{background:var(--blue-soft);color:var(--blue)}
.open-btn{margin-top:12px;height:38px;border-radius:10px;background:var(--vc);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:800;
  box-shadow:0 4px 10px rgba(31,64,110,.15);transition:.18s}
.open-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.open-btn svg{transition:transform .18s}
.open-btn:hover svg{transform:translateX(3px)}

/* ---------- 主题视图 ---------- */
.topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.topic-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;
  box-shadow:var(--shadow);animation:fadeUp .35s backwards;animation-delay:var(--d,0s)}
.tc-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.tc-icon{width:30px;height:30px;border-radius:9px;background:var(--blue-soft);color:var(--blue);
  display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
.tc-name{font-size:15px;font-weight:800;color:#173b68}
.tc-count{margin-left:auto;font-size:11.5px;color:#93a6b9;white-space:nowrap}
.tc-list{margin-top:7px}
.tc-item{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:7px;
  font-size:12.5px;color:#415a74;transition:.15s}
.tc-item:hover{background:#f2f7ff;color:var(--blue)}
.vbadge{font-size:10px;font-weight:800;color:#fff;border-radius:5px;padding:1px 6px;flex:none;
  letter-spacing:.2px}
.tc-book{color:#8fa2b6;font-size:11.5px;flex:none;white-space:nowrap}
.tc-ch{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-arrow{color:#bccddd;font-size:15px;flex:none}
.topic-more{display:block;width:100%;margin-top:7px;border:1px dashed #d7e5f6;background:#f8fbff;
  color:#5b7fa9;border-radius:8px;padding:6px;font-size:12px;cursor:pointer}
.topic-more:hover{background:var(--blue-soft);color:var(--blue)}

/* ---------- 其它 ---------- */
.empty{background:#fff;border:1px dashed #cddff2;border-radius:16px;padding:56px 20px;
  text-align:center;color:#7d93aa}
.empty b{display:block;font-size:17px;color:#2c4a69;margin-bottom:6px}
footer{border-top:1px solid var(--line);background:#fff;color:#8b9db0;font-size:12px}
.ft-inner{max-width:1320px;margin:0 auto;padding:18px 24px 26px;display:flex;gap:16px;
  justify-content:space-between;flex-wrap:wrap;line-height:1.9}
.ft-inner b{color:#5b7189}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);z-index:99;
  background:#16345c;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  box-shadow:0 8px 26px rgba(16,47,87,.3);opacity:0;pointer-events:none;transition:.25s;max-width:88vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1120px){.book-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.tb-hint{display:none}}
@media(max-width:760px){
  .hero h1{font-size:25px}
  .book-grid,.topic-grid{grid-template-columns:1fr!important}
  .tb-hint{display:none}.ver-meta{display:none}
  .tb-inner{gap:9px}.searchwrap{order:3;flex-basis:100%;max-width:none}
  .filterbar{position:static}.hero-inner{padding:18px 16px 16px}
  .wrap,.tb-inner,.fb-inner,.ft-inner{padding-left:16px;padding-right:16px}
}
@media print{.topbar,.filterbar,#toast{display:none}.hero{background:#fff}}
</style>
</head>

<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById('navData').textContent);
  var state = {view:'version', filter:'all', q:'', chapters:'open', cardOpen:{}, topicOpen:{}};
  var $ = function(s){ return document.querySelector(s); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function hl(text, q){
    var s = esc(text);
    if(!q) return s;
    try { return s.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark style="background:#ffe6a1;color:#7c3a00;border-radius:2px;padding:0 1px">$1</mark>'); }
    catch(e){ return s; }
  }
  function num(n){ return (n||0).toLocaleString('zh-CN'); }

  // ---------- 工具条版本筛选 ----------
  $('#verChips').innerHTML = D.versions.map(function(v){
    return '<button class="fchip" data-filter="'+v.code+'" style="margin-right:6px">'+esc(v.name)+'</button>';
  }).join('');

  // ---------- 按版本视图 ----------
  function bookCard(b, idx, forceOpen){
    var q = state.q, all = b.chapters;
    var hits = q ? all.filter(function(c){ return c.full.toLowerCase().indexOf(q) >= 0; }) : [];
    var open = (state.chapters === 'open') || !!state.cardOpen[b.code] || forceOpen || hits.length > 0;
    var limit = open ? all.length : 4;
    var list = all.slice(0, limit).map(function(c, i){
      var hit = q && c.full.toLowerCase().indexOf(q) >= 0;
      return '<a class="chapter'+(hit?' hit':'')+'" href="'+b.file+'#'+c.id+'" target="_blank" rel="noopener" '+
        'data-ch="'+esc(c.full)+'" data-book="'+esc(b.name)+'" title="打开《'+esc(b.name)+'》并定位：'+esc(c.full)+(c.meta?'（'+esc(c.meta)+'）':'')+'">'+
        '<span class="ch-no">'+esc(isNaN(Number(c.ord))?c.ord:(Number(c.ord)<10?'0'+c.ord:c.ord))+'</span>'+
        '<span class="ch-name">'+hl(c.full,q)+'</span>'+
        (c.kp?'<span class="ch-kp">'+c.kp+' 点</span>':'')+
        '<span class="ch-arrow">›</span></a>';
    }).join('');
    if(!open && all.length > 4){
      list += '<button class="more" data-more="'+b.code+'">展开全部 '+all.length+' 章 ▾</button>';
    } else if(state.chapters === 'closed' && !forceOpen && !hits.length && state.cardOpen[b.code]){
      list += '<button class="more" data-fold="'+b.code+'">收起章目录 ▴</button>';
    }
    var s = b.stats;
    return '<article class="book-card" style="--vc:'+b.color+';--vcs:'+b.soft+';--d:'+(idx%6*0.035)+'s" data-code="'+b.code+'">'+
      '<div class="bc-top"><span class="pill '+b.type+'">'+esc(b.short)+'</span><span class="code">'+esc(b.code)+'</span></div>'+
      '<h3 class="bc-name">'+hl(b.name,q)+'</h3>'+
      '<div class="bc-sub" title="'+esc(b.title)+' · '+esc(b.brief)+'">'+esc(b.brief)+'</div>'+
      '<div class="metrics"><span class="metric"><b>'+s.ch+'</b> 章</span>'+
        '<span class="metric"><b>'+s.sec+'</b> 节</span>'+
        '<span class="metric"><b>'+s.sub+'</b> 小节</span>'+
        '<span class="metric"><b>'+num(s.kp)+'</b> 知识点</span></div>'+
      '<div class="chapters">'+list+'</div>'+
      '<a class="open-btn" href="'+b.file+'" target="_blank" rel="noopener" data-book="'+esc(b.name)+'">'+
        '打开完整知识点目录'+
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h13m-5-6 6 6-6 6"/></svg></a>'+
      '</article>';
  }

  function renderVersion(){
    var q = state.q, html = '', shownBooks = 0, shownChapters = 0, hitChapters = 0;
    D.versions.forEach(function(v){
      if(state.filter !== 'all' && state.filter !== 'b' && state.filter !== 'xb' && state.filter !== v.code) return;
      var groups = [
        {key:'b', label:'必修系列', cls:'b'},
        {key:'xb', label:'选择性必修系列', cls:'xb'}
      ];
      var inner = '', vb = 0;
      groups.forEach(function(g){
        if(state.filter === 'b' && g.key !== 'b') return;
        if(state.filter === 'xb' && g.key !== 'xb') return;
        var books = v.books.filter(function(b){
          if(b.type !== g.key) return false;
          if(q && b.search.indexOf(q) < 0) return false;
          return true;
        });
        if(!books.length) return;
        vb += books.length;
        var cols = ({1:2,2:2,3:3,4:2})[books.length] || 3;
        inner += '<div class="group-title"><span class="gtag '+g.cls+'">'+g.label+'</span>'+
                 '<span class="gcount">'+books.length+' 册</span></div>'+
                 '<div class="book-grid" style="--cols:'+cols+'">'+
                 books.map(function(b,i){ return bookCard(b,i,false); }).join('')+'</div>';
      });
      if(!vb) return;
      shownBooks += vb;
      v.books.forEach(function(b){
        if((state.filter==='b'||state.filter==='xb') && b.type!==state.filter) return;
        if(q && b.search.indexOf(q)<0) return;
        shownChapters += b.chapters.length;
        if(q) hitChapters += b.chapters.filter(function(c){
          return c.full.toLowerCase().indexOf(q) >= 0; }).length;
      });
      html += '<section class="ver-block" id="ver-'+v.code+'" style="--vc:'+v.color+';--vcs:'+v.soft+'">'+
        '<div class="ver-head"><div class="ver-badge">'+v.code+'</div>'+
        '<div class="ver-txt"><div class="ver-name">'+esc(v.name)+'</div>'+
        '<div class="ver-desc">'+esc(v.pub)+' · 共 '+v.books.length+' 册</div></div>'+
        '<div class="ver-meta"><span class="vm"><b>'+v.totals.books+'</b> 册</span>'+
        '<span class="vm"><b>'+v.totals.chapters+'</b> 章</span>'+
        '<span class="vm"><b>'+num(v.totals.kps)+'</b> 知识点</span></div></div>'+
        inner+'</section>';
    });
    $('#versionView').innerHTML = html;
    return [shownBooks, shownChapters, hitChapters];
  }

  // ---------- 按主题视图 ----------
  function renderTopic(){
    var q = state.q, html = '', totalItems = 0, shownTopics = 0;
    D.topics.forEach(function(t, ti){
      var items = t.items.filter(function(it){
        return !q || (it.ch + ' ' + it.name + ' ' + it.verName + ' ' + it.book).toLowerCase().indexOf(q) >= 0;
      });
      if(!items.length) return;
      shownTopics++; totalItems += items.length;
      var open = state.topicOpen[t.name] || !!q;
      var list = items.slice(0, open ? items.length : 6).map(function(it){
        return '<a class="tc-item" href="'+it.file+'#'+it.id+'" target="_blank" rel="noopener" '+
          'data-ch="'+esc(it.ch)+'" data-book="'+esc(it.name)+'" title="'+esc(it.name)+' · '+esc(it.ch)+'">'+
          '<span class="vbadge" style="background:'+it.color+'">'+esc(it.ver)+'</span>'+
          '<span class="tc-book">'+esc(it.book)+'</span>'+
          '<span class="tc-ch">'+hl(it.ch,q)+'</span><span class="tc-arrow">›</span></a>';
      }).join('');
      if(items.length > 6 && !q){
        list += '<button class="topic-more" data-topic="'+esc(t.name)+'">'+
          (open ? '收起 ▴' : '展开其余 '+(items.length-6)+' 章 ▾')+'</button>';
      }
      html += '<div class="topic-card" style="--d:'+(ti%8*0.03)+'s">'+
        '<div class="tc-head"><div class="tc-icon">'+(ti+1<10?'0':'')+(ti+1)+'</div>'+
        '<div class="tc-name">'+esc(t.name)+'</div>'+
        '<div class="tc-count">'+items.length+' 章 · 跨 '+new Set(items.map(function(x){return x.ver;})).size+' 个版本</div></div>'+
        '<div class="tc-list">'+list+'</div></div>';
    });
    $('#topicGrid').innerHTML = html;
    $('#topicIntro').innerHTML = '<b>按主题横向速查</b>：把五个版本 '+D.totals.chapters+
      ' 个章按主题关键词归类，点击任意章即可直达对应教材目录。'+
      (q ? ' 当前关键词「<b>'+esc(q)+'</b>」命中 '+totalItems+' 章。' : ' 共 '+shownTopics+' 个主题、'+totalItems+' 章。');
    return [shownTopics, totalItems];
  }

  // ---------- 总渲染 ----------
  function render(){
    document.body.classList.toggle('filtering', !!state.q);
    var isV = state.view === 'version';
    $('#versionView').hidden = !isV;
    $('#topicView').hidden = isV;
    $('#toggleChapters').style.display = isV ? '' : 'none';
    var r = isV ? renderVersion() : renderTopic();
    var noResult = r[0] === 0;
    $('#empty').hidden = !noResult;
    if(isV){
      $('#resultCount').innerHTML = state.q
        ? '搜索「<b>'+esc(state.q)+'</b>」· 命中 <b>'+r[0]+'</b> 册 / <b>'+r[2]+'</b> 章'
        : '共 <b>'+r[0]+'</b> 册教材 · <b>'+r[1]+'</b> 章';
    } else {
      $('#resultCount').innerHTML = state.q
        ? '搜索「<b>'+esc(state.q)+'</b>」· 命中 <b>'+r[1]+'</b> 章'
        : '共 <b>'+r[0]+'</b> 个主题 · <b>'+r[1]+'</b> 章';
    }
    Array.prototype.forEach.call(document.querySelectorAll('#viewSeg button'), function(b){
      b.classList.toggle('on', b.dataset.view === state.view);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.fchip'), function(b){
      b.classList.toggle('on', b.dataset.filter === state.filter);
    });
    $('#clearq').classList.toggle('show', !!state.q);
  }

  // ---------- 提示与剪贴板 ----------
  var toastTimer;
  function toast(msg){
    var el = $('#toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 3000);
  }
  function copyText(t){
    try {
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).catch(function(){}); return;
      }
    } catch(e){}
    try {
      var ta = document.createElement('textarea'); ta.value = t;
      ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    } catch(e){}
  }

  // ---------- 事件 ----------
  $('#q').addEventListener('input', function(e){
    state.q = e.target.value.trim().toLowerCase(); render();
  });
  $('#clearq').addEventListener('click', function(){
    $('#q').value = ''; state.q = ''; render(); $('#q').focus();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); }
    if(e.key === 'Escape' && document.activeElement === $('#q')){
      $('#q').value = ''; state.q = ''; render(); $('#q').blur();
    }
  });
  $('#viewSeg').addEventListener('click', function(e){
    var b = e.target.closest('button[data-view]'); if(!b) return;
    state.view = b.dataset.view; render(); window.scrollTo({top:0,behavior:'smooth'});
  });
  $('#filterBar').addEventListener('click', function(e){
    var b = e.target.closest('.fchip');
    if(b){
      state.filter = b.dataset.filter;
      if(state.view !== 'version') state.view = 'version';
      render(); return;
    }
    if(e.target.id === 'toggleChapters'){
      state.chapters = state.chapters === 'open' ? 'closed' : 'open';
      state.cardOpen = {};
      e.target.textContent = state.chapters === 'open' ? '收起章目录' : '展开章目录';
      render();
    }
  });
  document.querySelector('main').addEventListener('click', function(e){
    var m = e.target.closest('[data-more]');
    if(m){ state.cardOpen[m.dataset.more] = true; render(); return; }
    var f = e.target.closest('[data-fold]');
    if(f){ delete state.cardOpen[f.dataset.fold]; render(); return; }
    var t = e.target.closest('[data-topic]');
    if(t){
      var k = t.dataset.topic;
      if(state.topicOpen[k]) delete state.topicOpen[k]; else state.topicOpen[k] = true;
      render(); return;
    }
    var a = e.target.closest('a[data-ch]');
    if(a){
      copyText(a.dataset.ch);
      toast('已打开《' + a.dataset.book + '》 · 章名「' + a.dataset.ch + '」已复制，可在页内搜索框精确定位');
    }
  });
  render();
})();
</script>
</body>
</html>
