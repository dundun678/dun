<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>取珠益智游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px;
            color: #fff;
            overflow-x: hidden;
        }

        h1 {
            font-size: 1.4em;
            margin: 4px 0 6px;
            text-shadow: 0 0 15px rgba(255,215,0,0.4);
            background: linear-gradient(90deg, #ffd700, #ff9f43, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .game-info {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .status-box {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 6px 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            text-align: center;
            min-width: 90px;
        }

        .status-box .label {
            font-size: 0.65em;
            color: #aaa;
            margin-bottom: 2px;
        }

        .status-box .value {
            font-size: 0.95em;
            font-weight: bold;
        }

        .turn-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
            animation: pulse 1.5s infinite;
        }

        .turn-human { background: #4ecdc4; }
        .turn-ai { background: #ff6b6b; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .control-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            gap: 4px;
            align-items: center;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 4px 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .control-group label {
            font-size: 0.75em;
            color: #ccc;
            white-space: nowrap;
        }

        .control-group select {
            padding: 5px 8px;
            font-size: 0.78em;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.4);
            color: #fff;
            cursor: pointer;
            outline: none;
            min-width: 90px;
        }

        .control-group select option {
            background: #1b263b;
            color: #fff;
        }

        .btn {
            padding: 7px 14px;
            font-size: 0.8em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            outline: none;
            white-space: nowrap;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-start:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-confirm {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            display: none;
        }

        .btn-confirm:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.4);
        }

        .btn-confirm:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.6;
        }

        .btn-reset {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .btn-reset:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-rules {
            background: linear-gradient(135deg, #feca57, #ff9f43);
            color: #333;
        }

        .btn-rules:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(254, 202, 87, 0.4);
        }

        .game-board {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: flex-end;
            padding: 10px 6px;
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            margin-bottom: 6px;
            min-height: 220px;
            flex-wrap: nowrap;
            overflow-x: auto;
            width: 100%;
            max-width: 100%;
        }

        .pillar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease;
            padding: 4px;
            border-radius: 10px;
            min-width: 50px;
            flex-shrink: 0;
        }

        .pillar-container:hover {
            transform: translateY(-3px);
        }

        .pillar-container.selected {
            background: rgba(78, 205, 196, 0.15);
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.25);
        }

        .pillar-container.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        .pillar-label {
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 4px;
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
        }

        .count-badge {
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            font-weight: bold;
            margin-bottom: 3px;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .pillar-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pillar-pole {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 8px;
            width: 4px;
            height: 180px;
            background: linear-gradient(180deg, #8B7355, #654321, #8B7355);
            border-radius: 2px;
            z-index: 0;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.5);
        }

        .beads-stack {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            min-height: 180px;
            justify-content: flex-start;
            position: relative;
            z-index: 1;
            padding-bottom: 8px;
        }

        .bead {
            width: 44px;
            height: 18px;
            border-radius: 50%;
            margin: 1px 0;
            position: relative;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 
                inset 0 -2px 6px rgba(0,0,0,0.4),
                inset 0 2px 6px rgba(255,255,255,0.4),
                0 1px 3px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .bead::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 18%;
            width: 64%;
            height: 35%;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
        }

        .bead::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(0,0,0,0.2);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }

        .bead.flying {
            animation: flyAway 0.7s ease-in forwards;
        }

        @keyframes flyAway {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
            }
            40% {
                transform: translateY(-60px) rotate(120deg) scale(1.1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-200px) rotate(360deg) scale(0);
                opacity: 0;
            }
        }

        .bead-color-1 { background: linear-gradient(180deg, #ff6b6b, #c0392b); }
        .bead-color-2 { background: linear-gradient(180deg, #feca57, #e67e22); }
        .bead-color-3 { background: linear-gradient(180deg, #48dbfb, #2980b9); }
        .bead-color-4 { background: linear-gradient(180deg, #1dd1a1, #27ae60); }
        .bead-color-5 { background: linear-gradient(180deg, #ff9ff3, #8e44ad); }
        .bead-color-6 { background: linear-gradient(180deg, #a29bfe, #6c5ce7); }

        .pillar-base {
            width: 52px;
            height: 8px;
            background: linear-gradient(90deg, #5D4037, #8D6E63, #5D4037);
            border-radius: 4px;
            margin-top: 2px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }

        .selection-info {
            margin-top: 4px;
            font-size: 0.72em;
            color: #4ecdc4;
            min-height: 16px;
            text-align: center;
            font-weight: bold;
        }

        .message-area {
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95em;
            margin-bottom: 4px;
        }

        .message-win {
            color: #ffd700;
            font-size: 1.1em;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .ai-thinking {
            color: #ff9f43;
            font-style: italic;
        }

        /* 规则弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1b263b, #0d1b2a);
            border-radius: 16px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: #ffd700;
            margin-bottom: 12px;
            text-align: center;
            font-size: 1.2em;
        }

        .modal-content p {
            color: #ccc;
            line-height: 1.7;
            font-size: 0.88em;
            margin-bottom: 8px;
        }

        .modal-content .highlight {
            color: #ff6b6b;
            font-weight: bold;
        }

        .modal-content .level-info {
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 8px 12px;
            margin: 6px 0;
            border-left: 3px solid #4ecdc4;
        }

        .modal-content .level-info strong {
            color: #4ecdc4;
        }

        .btn-know {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            font-size: 0.95em;
        }

        .btn-know:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.4);
        }

        .ai-brain {
            display: inline-block;
            animation: brainPulse 0.5s infinite alternate;
        }

        @keyframes brainPulse {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        @media (max-width: 400px) {
            h1 { font-size: 1.15em; }
            .bead { width: 38px; height: 16px; }
            .pillar-base { width: 46px; }
            .pillar-pole { height: 160px; }
            .beads-stack { min-height: 160px; }
            .game-board { min-height: 190px; }
            .btn { padding: 6px 10px; font-size: 0.75em; }
            .control-group select { min-width: 75px; font-size: 0.72em; }
        }
    </style>
</head>
<body>
    <h1>🎮 取珠益智游戏</h1>

    <div class="game-info">
        <div class="status-box">
            <div class="label">当前回合</div>
            <div class="value" id="turnDisplay">
                <span class="turn-indicator turn-human"></span>等待开始
            </div>
        </div>
        <div class="status-box">
            <div class="label">剩余珠子</div>
            <div class="value" id="remainingBeads">0</div>
        </div>
        <div class="status-box">
            <div class="label">游戏状态</div>
            <div class="value" id="gameStatus">未开始</div>
        </div>
    </div>

    <div class="control-row">
        <div class="control-group">
            <label for="levelSelect">等级：</label>
            <select id="levelSelect">
                <option value="1">🌱 初级 (4柱)</option>
                <option value="2">🌿 中级 (5柱)</option>
                <option value="3">🌳 高级 (6柱)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="firstPlayer">先手：</label>
            <select id="firstPlayer">
                <option value="human">👤 玩家</option>
                <option value="ai">🤖 AI</option>
            </select>
        </div>
        <button class="btn btn-rules" onclick="showRules()">📜 游戏规则</button>
    </div>

    <div class="control-row">
        <button class="btn btn-start" onclick="startGame()">🚀 开始游戏</button>
        <button class="btn btn-reset" onclick="resetGame()">🔄 重新开始</button>
        <button class="btn btn-confirm" id="confirmBtn" onclick="confirmMove()" disabled>
            ✅ 确定取珠
        </button>
    </div>

    <div class="message-area" id="messageArea"></div>

    <div class="game-board" id="gameBoard"></div>

    <div class="modal-overlay" id="rulesModal">
        <div class="modal-content">
            <h3>📜 游戏规则</h3>
            <div class="level-info">
                <strong>🌱 初级：</strong>4根柱子，分别装有1、2、3、4颗珠子
            </div>
            <div class="level-info">
                <strong>🌿 中级：</strong>5根柱子，分别装有1、2、3、4、5颗珠子
            </div>
            <div class="level-info">
                <strong>🌳 高级：</strong>6根柱子，分别装有1、2、3、4、5、6颗珠子
            </div>
            <p>
                1. 玩家与AI轮流取珠，每次可选择任意一根柱子。<br>
                2. 取走该柱子上<span class="highlight">最上方的一个或多个</span>连续珠子（最少1个，可一次取完整根柱子）。<br>
                3. 点击柱子选中要取的珠子，再点击<span class="highlight">"确定取珠"</span>按钮执行。<br>
                4. <span class="highlight">特殊规则</span>：当且仅有一根柱子剩2颗珠子，其余柱子已空时，轮到的一方只能取走<span class="highlight">1颗</span>珠子。<br>
                5. <span class="highlight">取到最后一颗珠子的一方获胜！</span>
            </p>
            <button class="btn btn-know" onclick="hideRules()">👌 知道了</button>
        </div>
    </div>

    <script>
        // ==================== 数表配置 ====================
        const NUMBER_TABLES = {
            1: new Set([2, 11, 33, 122, 134, 1111, 1123]),
            2: new Set([2, 11, 33, 44, 122, 134, 235, 1111, 1123, 1144, 1245, 1333, 2222, 2233, 2244, 11122, 11133, 11145, 12223, 12334]),
            3: new Set([2, 11, 33, 44, 55, 122, 134, 156, 235, 246, 1111, 1123, 1144, 1155, 1245, 1333, 2222, 2233, 2244, 2255, 3344, 3355, 3456, 11122, 11133, 11145, 11246, 11356, 12223, 12256, 12334, 12355, 12444, 13445, 22245, 22346, 23333, 23356, 111111, 111123, 111144, 111155, 112222, 112233, 112244, 112255, 112345, 111256, 113355, 122246, 113333, 113344, 123446])
        };

        // ==================== 游戏配置 ====================
        const LEVEL_CONFIG = {
            1: { pillars: 4, beads: [1, 2, 3, 4] },
            2: { pillars: 5, beads: [1, 2, 3, 4, 5] },
            3: { pillars: 6, beads: [1, 2, 3, 4, 5, 6] }
        };

        let gameState = {
            pillars: [],
            selectedPillar: -1,
            selectedCount: 0,
            currentTurn: 'human',
            gameStarted: false,
            gameOver: false,
            firstPlayer: 'human',
            level: 2
        };

        const beadColors = ['bead-color-1', 'bead-color-2', 'bead-color-3', 'bead-color-4', 'bead-color-5', 'bead-color-6'];

        // ==================== 核心工具函数 ====================

        // 将柱子珠子数排序后拼接成整数
        function getSortedNumber(pillars) {
            const nonEmpty = pillars.filter(c => c > 0).sort((a, b) => a - b);
            if (nonEmpty.length === 0) return 0;
            return parseInt(nonEmpty.join(''));
        }

        // 获取有珠子的柱子索引，按珠子数从多到少排序
        function getPillarsByCountDesc(pillars) {
            const result = [];
            for (let i = 0; i < pillars.length; i++) {
                if (pillars[i] > 0) {
                    result.push({ index: i, count: pillars[i] });
                }
            }
            return result.sort((a, b) => b.count - a.count);
        }

        // 检查是否触发特殊规则：仅剩一根柱子有2颗
        function isSpecialRule(pillars) {
            const nonEmpty = pillars.filter(c => c > 0);
            return nonEmpty.length === 1 && nonEmpty[0] === 2;
        }

        // ==================== 初始化与渲染 ====================

        function init() {
            gameState.level = parseInt(document.getElementById('levelSelect').value);
            const config = LEVEL_CONFIG[gameState.level];
            gameState.pillars = [...config.beads];
            initBoard();
            updateUI();
        }

        function initBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            const config = LEVEL_CONFIG[gameState.level];

            for (let i = 0; i < config.pillars; i++) {
                const pillarNum = i + 1;
                const beadCount = gameState.pillars[i] || 0;

                const container = document.createElement('div');
                container.className = 'pillar-container';
                container.id = `pillar-${i}`;
                container.onclick = () => selectPillar(i);

                const label = document.createElement('div');
                label.className = 'pillar-label';
                label.textContent = `${pillarNum}号`;

                const countBadge = document.createElement('div');
                countBadge.className = 'count-badge';
                countBadge.id = `count-${i}`;
                countBadge.textContent = beadCount;

                const wrapper = document.createElement('div');
                wrapper.className = 'pillar-wrapper';

                const pole = document.createElement('div');
                pole.className = 'pillar-pole';

                const stack = document.createElement('div');
                stack.className = 'beads-stack';
                stack.id = `stack-${i}`;

                for (let j = 0; j < beadCount; j++) {
                    const bead = document.createElement('div');
                    bead.className = `bead ${beadColors[j % 6]}`;
                    bead.id = `bead-${i}-${j}`;
                    stack.appendChild(bead);
                }

                const base = document.createElement('div');
                base.className = 'pillar-base';

                wrapper.appendChild(pole);
                wrapper.appendChild(stack);
                wrapper.appendChild(base);

                const info = document.createElement('div');
                info.className = 'selection-info';
                info.id = `info-${i}`;

                container.appendChild(label);
                container.appendChild(countBadge);
                container.appendChild(wrapper);
                container.appendChild(info);

                board.appendChild(container);
            }
        }

        function updateUI() {
            const total = gameState.pillars.reduce((a, b) => a + b, 0);
            document.getElementById('remainingBeads').textContent = total;

            const turnDisplay = document.getElementById('turnDisplay');
            const gameStatus = document.getElementById('gameStatus');

            if (!gameState.gameStarted) {
                turnDisplay.innerHTML = '<span class="turn-indicator turn-human"></span>等待开始';
                gameStatus.textContent = '未开始';
            } else if (gameState.gameOver) {
                turnDisplay.innerHTML = '游戏结束';
            } else if (gameState.currentTurn === 'human') {
                turnDisplay.innerHTML = '<span class="turn-indicator turn-human"></span>玩家回合';
                gameStatus.textContent = '进行中';
            } else {
                turnDisplay.innerHTML = '<span class="turn-indicator turn-ai"></span>AI思考中';
                gameStatus.textContent = 'AI回合';
            }

            const config = LEVEL_CONFIG[gameState.level];
            for (let i = 0; i < config.pillars; i++) {
                const container = document.getElementById(`pillar-${i}`);
                const countBadge = document.getElementById(`count-${i}`);
                const info = document.getElementById(`info-${i}`);

                if (!container) continue;

                const count = gameState.pillars[i] || 0;
                countBadge.textContent = count;

                if (count === 0) {
                    container.classList.add('disabled');
                    info.textContent = '';
                } else {
                    container.classList.remove('disabled');
                }

                if (gameState.selectedPillar === i) {
                    container.classList.add('selected');
                    info.textContent = `取${gameState.selectedCount}颗`;
                } else {
                    container.classList.remove('selected');
                    info.textContent = '';
                }
            }

            const confirmBtn = document.getElementById('confirmBtn');
            if (gameState.gameStarted && !gameState.gameOver && 
                gameState.currentTurn === 'human' && gameState.selectedPillar !== -1) {
                confirmBtn.style.display = 'inline-block';
                confirmBtn.disabled = false;
            } else {
                confirmBtn.disabled = true;
                if (!gameState.gameStarted || gameState.gameOver) {
                    confirmBtn.style.display = 'none';
                }
            }
        }

        // ==================== 玩家操作 ====================

        function selectPillar(pillarIndex) {
            if (!gameState.gameStarted || gameState.gameOver || 
                gameState.currentTurn !== 'human') return;

            if (!gameState.pillars[pillarIndex] || gameState.pillars[pillarIndex] === 0) return;

            // 特殊规则
            if (isSpecialRule(gameState.pillars) && gameState.pillars[pillarIndex] === 2) {
                gameState.selectedPillar = pillarIndex;
                gameState.selectedCount = 1;
            } else {
                if (gameState.selectedPillar === pillarIndex) {
                    gameState.selectedCount++;
                    if (gameState.selectedCount > gameState.pillars[pillarIndex]) {
                        gameState.selectedCount = 1;
                    }
                } else {
                    gameState.selectedPillar = pillarIndex;
                    gameState.selectedCount = 1;
                }
            }

            updateUI();
        }

        function confirmMove() {
            if (gameState.selectedPillar === -1 || gameState.selectedCount === 0) return;

            const pillarIndex = gameState.selectedPillar;
            const count = gameState.selectedCount;

            animateRemoveBeads(pillarIndex, count, () => {
                gameState.pillars[pillarIndex] -= count;
                gameState.selectedPillar = -1;
                gameState.selectedCount = 0;

                const total = gameState.pillars.reduce((a, b) => a + b, 0);
                if (total === 0) {
                    endGame('human');
                    return;
                }

                gameState.currentTurn = 'ai';
                updateUI();
                setTimeout(aiMove, 600);
            });
        }

        function animateRemoveBeads(pillarIndex, count, callback) {
            const stack = document.getElementById(`stack-${pillarIndex}`);
            const beads = stack.querySelectorAll('.bead');
            const beadsToRemove = Array.from(beads).slice(-count);

            let completed = 0;
            beadsToRemove.forEach((bead, index) => {
                setTimeout(() => {
                    bead.classList.add('flying');
                    setTimeout(() => {
                        bead.remove();
                        completed++;
                        if (completed === count) callback();
                    }, 700);
                }, index * 80);
            });
        }

        // ==================== AI 数表策略引擎 ====================

        function aiMove() {
            if (gameState.gameOver) return;

            showMessage('<span class="ai-brain">🤖 AI正在深度推理运算...</span>', 'ai-thinking');

            setTimeout(() => {
                const move = calculateAIMove();

                if (move) {
                    const { pillar, count } = move;
                    showMessage(`🤖 AI从${pillar + 1}号柱取走${count}颗珠子`, 'ai-thinking');

                    animateRemoveBeads(pillar, count, () => {
                        gameState.pillars[pillar] -= count;

                        const total = gameState.pillars.reduce((a, b) => a + b, 0);
                        if (total === 0) {
                            endGame('ai');
                            return;
                        }

                        gameState.currentTurn = 'human';
                        showMessage('👤 轮到你了！请选择柱子', '');
                        updateUI();
                    });
                }
            }, 800);
        }

        // 核心AI算法：基于数表匹配 + 特殊规则 + 深度搜索
        function calculateAIMove() {
            const pillars = [...gameState.pillars];
            const numTable = NUMBER_TABLES[gameState.level];

            // 检查特殊规则
            if (isSpecialRule(pillars)) {
                const idx = pillars.findIndex(c => c === 2);
                return { pillar: idx, count: 1 };
            }

            // 当前局面的排序数字
            const currentNum = getSortedNumber(pillars);

            // 如果当前局面已在数表中，说明对手把我们带到了必胜态，我们需要尽力应对
            // 策略：从珠子最多的柱子开始模拟取珠
            const sortedPillars = getPillarsByCountDesc(pillars);

            // 第一步：尝试数表匹配策略
            for (const pInfo of sortedPillars) {
                const pillarIdx = pInfo.index;
                const pillarCount = pInfo.count;

                // 特殊规则限制
                const special = isSpecialRule(pillars) && pillarCount === 2;
                const maxTake = special ? 1 : pillarCount;

                // 从取1个到取完，模拟每种情况
                for (let take = 1; take <= maxTake; take++) {
                    const newPillars = [...pillars];
                    newPillars[pillarIdx] -= take;

                    const n = getSortedNumber(newPillars);

                    // 如果模拟后的排序数字在数表中，执行此操作
                    if (numTable.has(n)) {
                        return { pillar: pillarIdx, count: take };
                    }
                }
            }

            // 第二步：数表匹配未找到，使用Minimax深度搜索寻找最优解
            const minimaxResult = minimaxSearch(pillars, 8, true, -Infinity, Infinity);
            if (minimaxResult && minimaxResult.move) {
                return minimaxResult.move;
            }

            // 第三步：Fallback - 从珠子最多的柱子取1个
            if (sortedPillars.length > 0) {
                const target = sortedPillars[0];
                return { pillar: target.index, count: 1 };
            }

            return null;
        }

        // Minimax + Alpha-Beta 剪枝深度搜索
        function minimaxSearch(pillars, depth, isMaximizing, alpha, beta) {
            const total = pillars.reduce((a, b) => a + b, 0);

            // 终止条件：无珠子可取
            if (total === 0) {
                // 上一步取完的人赢，当前方输
                return { score: isMaximizing ? -10000 : 10000, move: null };
            }

            // 深度限制：使用启发式评估
            if (depth === 0) {
                return { score: evaluatePositionAdvanced(pillars, isMaximizing), move: null };
            }

            const special = isSpecialRule(pillars);
            const moves = generateAllMoves(pillars, special);

            let bestScore = isMaximizing ? -Infinity : Infinity;
            let bestMove = null;

            for (const move of moves) {
                const newPillars = [...pillars];
                newPillars[move.pillar] -= move.count;

                const result = minimaxSearch(newPillars, depth - 1, !isMaximizing, alpha, beta);

                if (isMaximizing) {
                    if (result.score > bestScore) {
                        bestScore = result.score;
                        bestMove = move;
                    }
                    alpha = Math.max(alpha, result.score);
                } else {
                    if (result.score < bestScore) {
                        bestScore = result.score;
                        bestMove = move;
                    }
                    beta = Math.min(beta, result.score);
                }

                if (beta <= alpha) break;
            }

            return { score: bestScore, move: bestMove };
        }

        // 生成所有合法走法
        function generateAllMoves(pillars, specialRule) {
            const moves = [];
            const sorted = getPillarsByCountDesc(pillars);

            for (const pInfo of sorted) {
                if (pInfo.count === 0) continue;

                const maxTake = (specialRule && pInfo.count === 2) ? 1 : pInfo.count;

                for (let take = 1; take <= maxTake; take++) {
                    moves.push({ pillar: pInfo.index, count: take });
                }
            }

            return moves;
        }

        // 高级局面评估函数（结合数表、Nim理论、特殊规则）
        function evaluatePositionAdvanced(pillars, isMaximizing) {
            const total = pillars.reduce((a, b) => a + b, 0);
            const nonEmpty = pillars.filter(c => c > 0);
            const numTable = NUMBER_TABLES[gameState.level];
            const sortedNum = getSortedNumber(pillars);

            let score = 0;

            // 1. 数表匹配评估
            if (numTable.has(sortedNum)) {
                // 当前局面在数表中，对当前行动方通常不利（因为这是对手希望我们进入的局面）
                score -= 100;
            } else {
                score += 50;
            }

            // 2. Nim异或和评估
            let nimSum = 0;
            for (let c of pillars) nimSum ^= c;

            if (nimSum === 0) {
                score -= 30; // Nim和为0对当前方不利
            } else {
                score += 30;
            }

            // 3. 剩余珠子数评估
            if (total === 1) {
                // 只剩1颗，下一位玩家必取，当前方输
                score -= 200;
            } else if (total === 2) {
                const nonEmptyCount = nonEmpty.length;
                if (nonEmptyCount === 1) {
                    // 特殊规则触发，只能取1，对手取最后1个
                    score -= 150;
                } else if (nonEmptyCount === 2) {
                    // 2颗分布在2根柱子，对手可以取完一根赢
                    score -= 100;
                }
            } else if (total === 3) {
                if (nonEmpty.length === 1) {
                    // 3颗在一根柱子，可以取2让对手面对1颗
                    score += 80;
                }
            }

            // 4. 特殊规则局面制造评估
            if (nonEmpty.length === 2) {
                const counts = nonEmpty.sort((a, b) => a - b);
                if (counts[0] === 1 && counts[1] === 2) {
                    // 1和2分布，有利局面
                    score += 60;
                }
            }

            // 5. 柱子数量评估
            score += nonEmpty.length * 10;

            // 6. 对称性评估（Nim博弈中对称通常有利）
            const countMap = {};
            for (let c of nonEmpty) {
                countMap[c] = (countMap[c] || 0) + 1;
            }
            let symmetricPairs = 0;
            for (let k in countMap) {
                symmetricPairs += Math.floor(countMap[k] / 2);
            }
            score += symmetricPairs * 20;

            return isMaximizing ? score : -score;
        }

        // ==================== 游戏控制 ====================

        function endGame(winner) {
            gameState.gameOver = true;
            gameState.currentTurn = '';

            const messageArea = document.getElementById('messageArea');
            if (winner === 'human') {
                messageArea.innerHTML = '<div class="message-win">🎉 恭喜你！你取到了最后一颗珠子，你赢了！</div>';
            } else {
                messageArea.innerHTML = '<div class="message-win">🤖 AI取到了最后一颗珠子，AI赢了！再试一次吧！</div>';
            }

            updateUI();
        }

        function showMessage(text, className) {
            document.getElementById('messageArea').innerHTML = `<span class="${className}">${text}</span>`;
        }

        function startGame() {
            const level = parseInt(document.getElementById('levelSelect').value);
            const firstPlayer = document.getElementById('firstPlayer').value;
            const config = LEVEL_CONFIG[level];

            gameState = {
                pillars: [...config.beads],
                selectedPillar: -1,
                selectedCount: 0,
                currentTurn: firstPlayer,
                gameStarted: true,
                gameOver: false,
                firstPlayer: firstPlayer,
                level: level
            };

            initBoard();
            document.getElementById('messageArea').innerHTML = '';

            if (firstPlayer === 'ai') {
                showMessage('🤖 AI先手，请稍候...', 'ai-thinking');
                setTimeout(aiMove, 400);
            } else {
                showMessage('👤 玩家先手，请选择柱子', '');
            }

            updateUI();
        }

        function resetGame() {
            const level = parseInt(document.getElementById('levelSelect').value);
            const config = LEVEL_CONFIG[level];

            gameState = {
                pillars: [...config.beads],
                selectedPillar: -1,
                selectedCount: 0,
                currentTurn: 'human',
                gameStarted: false,
                gameOver: false,
                firstPlayer: 'human',
                level: level
            };

            document.getElementById('firstPlayer').value = 'human';
            document.getElementById('messageArea').innerHTML = '';
            initBoard();
            updateUI();
        }

        function showRules() {
            document.getElementById('rulesModal').classList.add('active');
        }

        function hideRules() {
            document.getElementById('rulesModal').classList.remove('active');
        }

        document.getElementById('levelSelect').addEventListener('change', function() {
            resetGame();
        });

        document.getElementById('rulesModal').addEventListener('click', function(e) {
            if (e.target === this) hideRules();
        });

        window.onload = function() {
            init();
        };
    </script>
